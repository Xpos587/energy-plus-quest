<rect x="2185" y="230" width="44" height="280" fill="#1d4f9c"/>
<rect x="2160" y="240" width="96" height="74" fill="#f47a20" stroke="#1d4f9c" stroke-width="5"/>
<circle cx="2195" cy="275" r="18" fill="#f0b48a"/>
<line x1="2220" y1="250" x2="1900" y2="190" stroke="#1d4f9c" stroke-width="16"/>
