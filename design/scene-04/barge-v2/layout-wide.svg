<rect x="1000" y="170" width="50" height="40" fill="#9fd1ef"/>
<line x1="1080" y1="170" x2="1620" y2="70" stroke="#1d4f9c" stroke-width="22"/>
<line x1="1600" y1="80" x2="1600" y2="560" stroke="#333" stroke-width="5"/>
