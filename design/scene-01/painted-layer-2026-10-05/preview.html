<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карта с фурами — кандидат</title>
<style>
:root{font-family:system-ui,sans-serif;color:#243b35;background:#f5f3ed;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:1500px;margin:auto;padding:20px}h1{font-size:clamp(22px,3vw,32px);letter-spacing:-.03em;margin:0}.note{color:#65736a;font-size:14px;margin:8px 0 16px;line-height:1.4}.toolbar,.transport,.selection{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}button,select{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #b9c6bb;border-radius:8px;background:#fff;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#244d40;color:#fff}button:disabled,select:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #df9430;outline-offset:3px}label{display:flex;gap:8px;align-items:center;min-height:44px}input[type=checkbox]{width:18px;height:18px;accent-color:#244d40}.viewport{height:min(68vh,800px,calc((100vw - 40px)*890/1280));min-height:280px;overflow:auto;border:1px solid #c7d0c4;border-radius:12px;background:#e6e7dc;overscroll-behavior:contain}.stage{position:relative;aspect-ratio:1280/890;margin:auto;line-height:0}video{display:block;width:100%;height:100%;object-fit:contain}.roof{position:absolute;min-height:44px;width:44px;padding:0;transform:translate(-50%,-50%);border:0;background:transparent!important;display:flex;align-items:center;justify-content:center}.roof span{display:flex;align-items:center;justify-content:center;width:21px;height:21px;background:var(--color);color:white;border:2px solid white;border-radius:50%;font-size:12px;font-weight:750;line-height:1;box-shadow:0 1px 4px #243b3580}.roof[aria-pressed=true] span{outline:3px solid #244d40;outline-offset:3px}.roof[hidden]{display:none}.truck:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--color);margin-right:6px}.transport input{flex:1;min-width:180px;accent-color:#244d40}.clock{font-variant-numeric:tabular-nums;white-space:nowrap}.status{font-size:14px;color:#99503a;min-height:20px}.selected{font-size:14px;color:#65736a;margin-left:auto}.zoom{display:flex;gap:6px}.source{max-width:100%}@media(max-width:600px){main{padding:14px}.viewport{height:min(56vh,calc((100vw - 28px)*890/1280));min-height:0}.toolbar{gap:8px}.source{flex-basis:100%}.source select{flex:1;min-width:0}.selection{gap:6px}.truck{flex:1;padding:8px 5px;font-size:13px}.selected{flex-basis:100%;margin:0}.transport input{order:3;flex-basis:100%}.clock{margin-left:auto}.note{max-width:34em}}
</style>
</head>
<body><main>
<h1>Карта с фурами</h1>
<p class="note" id="description">Пилот · 12 секунд. Цикл не замкнут.</p>
<div class="toolbar">
<label class="source">Видео <select id="source"><option value="pilot">Пилот · 12 с</option></select></label>
<div class="zoom" role="group" aria-label="Масштаб"><button data-zoom="1" aria-pressed="true">1×</button><button data-zoom="2" aria-pressed="false">2×</button><button data-zoom="4" aria-pressed="false">4×</button></div>
<label><input id="follow" type="checkbox">Следовать за фурой</label>
</div>
<div class="viewport" id="viewport" tabindex="0" aria-label="Карта. При увеличении перемещайте область прокруткой.">
<div class="stage" id="stage"><video id="video" muted playsinline preload="metadata" aria-label="Фуры на светлой карте"></video>
<button class="roof" data-truck="0" style="--color:#c24630" aria-label="Выбрать красную фуру" aria-pressed="false" hidden><span>1</span></button>
<button class="roof" data-truck="1" style="--color:#1779cf" aria-label="Выбрать синюю фуру" aria-pressed="false" hidden><span>2</span></button>
<button class="roof" data-truck="2" style="--color:#64aa54" aria-label="Выбрать зелёную фуру" aria-pressed="false" hidden><span>3</span></button>
<button class="roof" data-truck="3" style="--color:#e5ba40" aria-label="Выбрать жёлтую фуру" aria-pressed="false" hidden><span>4</span></button>
</div></div>
<div class="selection" role="group" aria-label="Выбор фуры">
<button class="truck" data-truck="0" style="--color:#c24630" aria-pressed="false">1 · Красная</button>
<button class="truck" data-truck="1" style="--color:#1779cf" aria-pressed="false">2 · Синяя</button>
<button class="truck" data-truck="2" style="--color:#64aa54" aria-pressed="false">3 · Зелёная</button>
<button class="truck" data-truck="3" style="--color:#e5ba40" aria-pressed="false">4 · Жёлтая</button>
<span class="selected" id="selected" role="status">Выберите фуру на крыше или под картой.</span>
</div>
<div class="transport"><button id="play">Воспроизвести</button><button id="restart">В начало</button><input id="timeline" type="range" min="0" max="12" step="0.001" value="0" aria-label="Позиция видео"><output class="clock" id="clock">0:00 / 0:12</output></div>
<p class="status" id="status" role="status"></p>
</main>
<script type="module">
const $=s=>document.querySelector(s),video=$('#video'),stage=$('#stage'),viewport=$('#viewport'),timeline=$('#timeline'),play=$('#play'),source=$('#source'),follow=$('#follow'),status=$('#status');
const sources={pilot:'composite-12s.mp4',candidate:'composite-loop-48s.mp4'},names=['Красная','Синяя','Зелёная','Жёлтая'],roofs=[...document.querySelectorAll('.roof')];
let tracking,selected=-1,zoom=1;
const timeLabel=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function centerOn(x,y){viewport.scrollLeft=x*stage.clientWidth-viewport.clientWidth/2;viewport.scrollTop=y*stage.clientHeight-viewport.clientHeight/2}
function paint(time=video.currentTime){const duration=Number.isFinite(video.duration)?video.duration:source.value==='candidate'?48:12;timeline.value=Math.min(time,duration);$('#clock').textContent=timeLabel(time)+' / '+timeLabel(duration);timeline.setAttribute('aria-valuetext',time.toFixed(1)+' из '+duration.toFixed(1)+' секунд');if(!tracking)return;const frame=Math.min(tracking.frames-1,Math.max(0,Math.floor(time*24+1e-6))),row=tracking.projected_roof_centers[frame];row.forEach(([x,y],i)=>{roofs[i].style.left=x*100+'%';roofs[i].style.top=y*100+'%';roofs[i].hidden=false});if(follow.checked&&selected>=0&&zoom>1)centerOn(...row[selected])}
function setZoom(next){const x=(viewport.scrollLeft+viewport.clientWidth/2)/stage.clientWidth||.5,y=(viewport.scrollTop+viewport.clientHeight/2)/stage.clientHeight||.5;zoom=next;const ratio=video.videoWidth/video.videoHeight||1280/890;stage.style.width=Math.min(viewport.clientWidth,viewport.clientHeight*ratio)*zoom+'px';document.querySelectorAll('[data-zoom]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.zoom)===zoom)));centerOn(x,y);paint()}
function chooseTruck(index){selected=index;document.querySelectorAll('[data-truck]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.truck)===selected)));$('#selected').textContent=names[index]+' фура · '+(index+1);paint()}
function chooseSource(){video.pause();video.src=sources[source.value];video.loop=source.value==='candidate';video.load();status.textContent='';$('#description').textContent=source.value==='candidate'?'Кандидат · 48 секунд. На проверке.':'Пилот · 12 секунд. Цикл не замкнут.';paint(0)}
document.querySelectorAll('[data-truck]').forEach(b=>b.addEventListener('click',()=>chooseTruck(Number(b.dataset.truck))));document.querySelectorAll('[data-zoom]').forEach(b=>b.addEventListener('click',()=>setZoom(Number(b.dataset.zoom))));follow.addEventListener('change',()=>{if(follow.checked&&selected<0)chooseTruck(0);paint()});source.addEventListener('change',chooseSource);
play.addEventListener('click',()=>{if(video.paused){if(video.ended)video.currentTime=0;video.play().catch(()=>status.textContent='Не удалось запустить видео.')}else video.pause()});$('#restart').addEventListener('click',()=>{video.currentTime=0;paint(0)});timeline.addEventListener('input',()=>{video.currentTime=Number(timeline.value);paint(Number(timeline.value))});
video.addEventListener('play',()=>play.textContent='Пауза');video.addEventListener('pause',()=>play.textContent='Воспроизвести');video.addEventListener('loadedmetadata',()=>{stage.style.aspectRatio=video.videoWidth+' / '+video.videoHeight;timeline.max=video.duration;setZoom(zoom)});video.addEventListener('timeupdate',()=>paint());video.addEventListener('seeked',()=>paint());video.addEventListener('error',()=>status.textContent='Видео пока недоступно.');window.addEventListener('resize',()=>setZoom(zoom));
if(video.requestVideoFrameCallback){const frame=(_,m)=>{paint(m.mediaTime);video.requestVideoFrameCallback(frame)};video.requestVideoFrameCallback(frame)}
fetch('../controlled-motion-2026-10-04/v2b/roof-tracking/carrier-roof-tracking.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(j=>{if(j.fps!==24||j.frames!==1152||j.projected_roof_centers?.length!==1152||j.projected_roof_centers.some(r=>r.length!==4))throw Error();tracking=j;paint()}).catch(()=>{follow.disabled=true;status.textContent='Точки на крышах недоступны.'});
async function checkCandidate(){if(source.querySelector('[value="candidate"]'))return;try{const r=await fetch(sources.candidate,{method:'HEAD',cache:'no-store'});if(r.ok&&r.headers.get('content-type')?.startsWith('video/'))source.add(new Option('Кандидат · 48 с','candidate'))}catch{}}
checkCandidate();const availability=setInterval(checkCandidate,30000);window.addEventListener('pagehide',()=>clearInterval(availability));chooseSource();
</script>
</body></html>
