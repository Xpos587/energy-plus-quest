version: "3"

tasks:
  dev:
    cmds:
      - bun run dev
  build:
    cmds:
      - bun run build
  test:
    cmds:
      - bun run test
  check:
    cmds:
      - bun run check
  verify:
    cmds:
      - task: check
      - task: test
      - task: build
  e2e:
    cmds:
      - bun run test:e2e
  release:
    cmds:
      - task: verify
      - task: e2e
      - sh scripts/package-static.sh
