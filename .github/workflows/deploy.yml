name: Build, Push and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Check repository storage
        run: bun run check:storage

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Dokploy deploy
        timeout-minutes: 3
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
          REVISION: ${{ github.sha }}
        run: |
          bun run - <<'JS'
          const applicationId = "pfnvsqxv0r5pqE-Pbr8qi";
          const metadata = JSON.parse(process.env.IMAGE_METADATA);
          const candidates = metadata.tags?.filter(tag =>
            /^ghcr\.io\/xpos587\/energy-plus-quest:sha-[0-9a-f]{7,40}$/.test(tag));
          if (candidates?.length !== 1) throw new Error("Expected exactly one immutable revision image tag");
          const image = candidates[0];
          const revision = process.env.REVISION;
          if (!/^[0-9a-f]{40}$/.test(revision) ||
              !revision.startsWith(image.split(":sha-")[1]))
            throw new Error("Image tag does not match this revision");
          if (!process.env.DOKPLOY_API_KEY) throw new Error("Missing Dokploy API key");
          async function api(route, body) {
            const response = await fetch(`https://dokploy.hypcat.net/api/${route}`, {
              method: body === undefined ? "GET" : "POST",
              headers: { "x-api-key": process.env.DOKPLOY_API_KEY,
                "Content-Type": "application/json" },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Dokploy ${route.split("?")[0]} returned HTTP ${response.status}`);
            return response.json();
          }
          const deployments = await api(`deployment.all?applicationId=${applicationId}`);
          if (!Array.isArray(deployments)) throw new Error("Unexpected deployment history response");
          if (deployments.some(item => ["running", "queued", "pending"].includes(item.status)))
            throw new Error("An application deployment is already active; no changes made");
          await api("application.update", { applicationId, sourceType: "docker", dockerImage: image });
          const application = await api(`application.one?applicationId=${applicationId}`);
          if (application.sourceType !== "docker" || application.dockerImage !== image)
            throw new Error("Dokploy image configuration did not match the requested revision");
          await api("application.deploy", { applicationId, title: `Git revision ${revision}` });
          console.log(`Deployment requested for ${image}`);
          JS
