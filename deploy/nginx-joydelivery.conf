# Include INSIDE the existing e-plus.media server { ... } block.
# Replace /path/to/webroot with the site's document root, NOT the game directory.
# Extract the ZIP into /path/to/webroot/specprojects/joydelivery/.
# See README-DEPLOY.txt in the archive. Validate with nginx -t before reload.

location = /specprojects/joydelivery {
  absolute_redirect off;
  return 301 /specprojects/joydelivery/$is_args$args;
}

# Isolate the game from the main site's regex handlers (WordPress, JS/CDN rules).
# Nested regex locations below still apply inside this prefix.
location ^~ /specprojects/joydelivery/ {
  absolute_redirect off;
  root /path/to/webroot;
  index index.html;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  add_header X-Content-Type-Options nosniff always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /specprojects/joydelivery/index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Optional browser cache worker must be revalidated on every update.
  location = /specprojects/joydelivery/quest-cache.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location ~* "^/specprojects/joydelivery/assets/[^/]+-[a-z0-9_-]{8,}\.(?:css|js|mjs|jpg|jpeg|png|gif|svg|ico|webp|avif|woff2?|ttf|otf|mp4|webm|mp3|ogg|wav)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|json|jpg|jpeg|png|gif|svg|ico|webp|avif|woff2?|ttf|otf|mp4|webm|mp3|ogg|wav)$ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Game navigation is internal state, not URL routing. Missing resources and
  # unknown URLs must never receive index.html with a misleading HTTP 200.
  try_files $uri $uri/ =404;
}
