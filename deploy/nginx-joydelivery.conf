# Include this location block in the e-plus.media server block.
# Extract release/energy-plus-quest-static.zip into the webroot so that
# index.html is directly under /specprojects/joydelivery/.

location = /specprojects/joydelivery/index.html {
  root /path/to/webroot;
  expires -1;
  add_header Cache-Control "no-cache";
}

location ~* ^/specprojects/joydelivery/.+\.(?:css|js|mjs|jpg|jpeg|png|gif|svg|ico|webp|avif|woff2?|ttf|otf)$ {
  root /path/to/webroot;
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}

location /specprojects/joydelivery/ {
  root /path/to/webroot;
  index index.html;
  try_files $uri $uri/ /specprojects/joydelivery/index.html;
}
