<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
  <title>Погрузка на фуру: четыре места в грузовом отсеке</title>
  <desc>Слева над задней осью стоят тяжёлые ящики с гирями. Первое место над ними без креплений. Второе — над защищённой посудой, с красными стропами. Третье — узкая ниша за тремя коробками. Четвёртое — высокое место у передней стенки, с креплениями и подушками.</desc>
